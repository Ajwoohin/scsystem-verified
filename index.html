<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Email verified | SCsystem</title>
  <style>
    :root {
      --bg: #1E2761;
      --card: #FFFFFF;
      --ink: #1E2761;
      --muted: #5B6788;
      --gold: #F5B301;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      font-family: Calibri, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      color: var(--ink);
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .badge {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-family: Cambria, Georgia, serif;
      font-size: 28px;
      margin: 0 0 10px;
    }
    p {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
    }
    .note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #E4E8F2;
      font-size: 13px;
    }
    .brand {
      margin-top: 22px;
      font-family: Cambria, Georgia, serif;
      font-weight: bold;
      font-size: 14px;
      color: var(--ink);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1E2761" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5l4.5 4.5L19 7.5"/>
      </svg>
    </div>
    <h1>Email verified</h1>
    <p>Your SCsystem account is confirmed. You can close this tab and go back to the app to log in.</p>
    <p class="note">Staff accounts still need administrator approval before they can sign in.</p>
    <div class="brand">SCsystem</div>
  </main>
</body>
</html>
